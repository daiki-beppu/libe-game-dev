<body>
<canvas id="game" width="800" height="480"></canvas>
<script>
'use strict';
// ============================================================
//  STELLAR VIPER  - グラディウス風 横スクロールシューティング
// ============================================================
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const W = 800, H = 480, PH = 440, SCROLL = 1.2, STAGE_LEN = 6400;
const FONT = '"Press Start 2P", monospace';
const THEMES = [
  { name:'NEBULA CAVERN', bg1:'#01020a', bg2:'#0b1236', rock1:'#2c6a3a', rock2:'#0a2010', edge:'#7dffa0',
    planet:['#8ab4ff','#1a2a6a'], sec:[[700,2700],[3500,5900]] },
  { name:'MAGMA BELT', bg1:'#0a0102', bg2:'#3a0e0a', rock1:'#8a3a14', rock2:'#2a0804', edge:'#ffb050',
    planet:['#ffb070','#6a1a0a'], sec:[[400,2000],[2600,4300],[4800,6000]] },
  { name:'CRYSTAL ZONE', bg1:'#04010c', bg2:'#1e0a3e', rock1:'#4a3a9a', rock2:'#120a30', edge:'#c8a8ff',
    planet:['#e0a0ff','#3a0a5a'], sec:[[500,3200],[3800,6000]] },
];
// ウェポンエディット (グラディウスIII風)
const WEAPONS = {
  missile: [
    { name:'MISSILE',  label:'MISSILE', desc:'地面を這うように進むミサイル' },
    { name:'2-WAY',    label:'2-WAY',   desc:'上下2方向へ発射。天井と地面を這う' },
    { name:'SPREAD BOMB', label:'SPREAD', desc:'着弾すると爆発し、周囲の敵を巻き込む' },
    { name:'PHOTON TORPEDO', label:'PHOTON', desc:'真下へ高速落下。敵を貫通する' },
  ],
  double: [
    { name:'DOUBLE',   label:'DOUBLE',  desc:'前方と斜め上に同時発射' },
    { name:'TAIL GUN', label:'TAIL',    desc:'前方と後方に同時発射' },
    { name:'3-WAY',    label:'3-WAY',   desc:'前方に扇状の3方向ショット' },
  ],
  laser: [
    { name:'LASER',    label:'LASER',   desc:'敵を貫通する長いレーザー' },
    { name:'RIPPLE LASER', label:'RIPPLE', desc:'広がりながら進むリング状レーザー' },
    { name:'TWIN LASER', label:'TWIN',  desc:'短い2本のレーザーを高速連射' },
  ],
  barrier: [
    { name:'FORCE FIELD', label:'FORCE', desc:'全方位を守るバリア（6発まで）' },
    { name:'SHIELD',   label:'SHIELD',  desc:'前方のみ守る盾（15発まで）' },
  ],
};
const EDIT_ROWS = ['missile','double','laser','barrier'];
let loadout = { missile:0, double:0, laser:0, barrier:0 }, selRow = 0;
try { const s = JSON.parse(localStorage.getItem('stellarViperLoadout')); if (s) loadout = { ...loadout, ...s }; } catch(e){}
const gaugeLabels = () => ['SPEED', WEAPONS.missile[loadout.missile].label, WEAPONS.double[loadout.double].label,
  WEAPONS.laser[loadout.laser].label, 'OPTION', WEAPONS.barrier[loadout.barrier].label];
const BX = [-20,-32,-44,-56]; // ボスのバリア位置

const clamp = (v,a,b) => v<a ? a : v>b ? b : v;
const rnd = (a,b) => a + Math.random()*(b-a);
const d2 = (ax,ay,bx,by) => (ax-bx)**2 + (ay-by)**2;
function rng(seed){ let a = seed>>>0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1|a); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0) / 4294967296; }; }

// ---------------- 入力 ----------------
const keys = {}, pressed = {};
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) pressed[e.code] = true;
  keys[e.code] = true;
  initAudio();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; if (state === 'play') paused = true; });
const K = {
  up:    () => keys.ArrowUp || keys.KeyW,
  down:  () => keys.ArrowDown || keys.KeyS,
  left:  () => keys.ArrowLeft || keys.KeyA,
  right: () => keys.ArrowRight || keys.KeyD,
  fire:  () => keys.KeyZ || keys.Space || keys.KeyJ,
};
const hit = (...codes) => codes.some(c => pressed[c]);

// ---------------- サウンド ----------------
let ac = null, master = null, noiseBuf = null, muted = false;
function initAudio(){
  if (ac){ if (ac.state === 'suspended') ac.resume(); return; }
  try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ return; }
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.5; master.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  if (bgm) nextT = ac.currentTime + 0.05;
}
function osc(freq, dur, {type='square', vol=0.2, slide=null, t=null} = {}){
  if (!ac) return;
  const t0 = t ?? ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g).connect(master); o.start(t0); o.stop(t0+dur+0.02);
}
function noise(dur, {vol=0.3, freq=2000, type='lowpass', t=null, endFreq=null} = {}){
  if (!ac) return;
  const t0 = t ?? ac.currentTime, s = ac.createBufferSource(); s.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.setValueAtTime(freq, t0);
  if (endFreq) f.frequency.exponentialRampToValueAtTime(endFreq, t0+dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  s.connect(f).connect(g).connect(master); s.start(t0); s.stop(t0+dur+0.02);
}
const SFX = {
  shot:    () => osc(1400, 0.06, {vol:0.05, slide:500}),
  laser:   () => osc(2400, 0.1, {type:'sawtooth', vol:0.03, slide:900}),
  hit:     () => osc(300, 0.05, {vol:0.06, slide:150}),
  tink:    () => osc(3200, 0.03, {vol:0.03, type:'triangle'}),
  boom:    () => { noise(0.35, {vol:0.22, freq:1500, endFreq:100}); osc(120, 0.25, {type:'triangle', vol:0.15, slide:40}); },
  bigBoom: () => { noise(1.4, {vol:0.4, freq:2000, endFreq:50}); osc(90, 1.2, {type:'sawtooth', vol:0.15, slide:25}); },
  capsule: () => { osc(880, 0.07, {vol:0.08}); osc(1320, 0.1, {vol:0.08, t:ac.currentTime+0.06}); },
  power:   () => [523,659,784,1047].forEach((f,i) => osc(f, 0.1, {vol:0.07, t:ac.currentTime+i*0.05})),
  die:     () => { noise(1, {vol:0.4, freq:3000, endFreq:80}); osc(600, 0.9, {vol:0.12, slide:40, type:'sawtooth'}); },
  shield:  () => osc(200, 0.15, {vol:0.1, type:'triangle', slide:600}),
  warn:    () => { for (let i=0;i<8;i++) osc(i%2 ? 660 : 880, 0.18, {vol:0.07, t:ac.currentTime+i*0.22, type:'sawtooth'}); },
  oneup:   () => [784,988,1175,1568].forEach((f,i) => osc(f, 0.12, {vol:0.08, t:ac.currentTime+i*0.08})),
  blue:    () => noise(0.8, {vol:0.35, freq:6000, endFreq:150, type:'bandpass'}),
  beam:    () => osc(900, 0.2, {type:'sawtooth', vol:0.04, slide:200}),
};
function sfx(n){ if (ac && !muted) SFX[n](); }

// BGM (簡易シーケンサー)
let bgm = null, nextT = 0, stepN = 0;
const ROOTS = [45,41,43,40];
const _ = 0;
const MEL = [
  69,_,72,_,76,_,74,72, 74,_,72,_,69,_,67,_,
  65,_,69,_,72,_,77,76, 74,_,72,_,74,_,76,_,
  67,_,71,_,74,_,79,77, 76,_,74,_,71,_,74,_,
  76,_,75,_,76,_,80,_,  83,_,80,_,76,_,71,_,
];
const BOSS_MEL = [76,_,79,_,76,_,82,_,81,_,79,_,76,_,74,_];
const mtof = m => 440 * Math.pow(2, (m-69)/12);
function startBgm(mode){ bgm = mode; stepN = 0; if (ac) nextT = ac.currentTime + 0.05; }
function stopBgm(){ bgm = null; }
function playStep(n, t){
  const st = n % 16, bar = (n >> 4) % 4;
  if (bgm === 'stage'){
    if (st % 2 === 0) osc(mtof(ROOTS[bar] + (st % 4 ? 12 : 0)), 0.16, {vol:0.05, t});
    const m = MEL[bar*16 + st]; if (m) osc(mtof(m), 0.18, {vol:0.035, t});
    if (st % 4 === 0) osc(150, 0.12, {type:'sine', vol:0.2, slide:40, t});
    if (st % 4 === 2) noise(0.03, {vol:0.03, freq:7000, type:'highpass', t});
    if (st === 4 || st === 12) noise(0.1, {vol:0.06, freq:1800, t});
  } else if (bgm === 'boss'){
    const r = [40,40,41,39][bar];
    osc(mtof(r + (st % 2 ? 12 : 0)), 0.08, {vol:0.05, t});
    const m = BOSS_MEL[st]; if (m) osc(mtof(m + (bar === 2 ? 1 : 0)), 0.12, {vol:0.03, type:'sawtooth', t});
    if (st % 4 === 0) osc(150, 0.12, {type:'sine', vol:0.2, slide:40, t});
    if (st % 2 === 1) noise(0.03, {vol:0.03, freq:7000, type:'highpass', t});
  }
}
setInterval(() => {
  if (!ac || !bgm) return;
  if (nextT < ac.currentTime) nextT = ac.currentTime + 0.02;
  while (nextT < ac.currentTime + 0.15){ playStep(stepN, nextT); nextT += bgm === 'boss' ? 0.085 : 0.1; stepN++; }
}, 25);

// ---------------- ゲーム状態 ----------------
let state = 'title', paused = false, frame = 0, score = 0, lives = 2, stage = 1, scrollX = 0;
let hi = 50000; try { hi = +localStorage.getItem('stellarViperHi') || 50000; } catch(e){}
let theme = THEMES[0], stageSeed = 0;
let player, hist, shots, enemies, ebullets, particles, capsules, pending, events, evIdx, boss;
let msg = null, stageClear = 0, capCount = 0, nextExtend = 50000, gameOverT = 0, warnT = 0, bossSpawned = false;
let flashT = 0, shakeT = 0, pw, cursor = -1;
const rank = () => stage - 1;

const stars = [];
for (let i=0;i<110;i++) stars.push({ x:Math.random()*W, y:Math.random()*PH, z:[0.3,0.8,2][i%3] });

function resetPower(){ pw = {speed:0, missile:false, double:false, laser:false, options:0, shield:0}; cursor = -1; }
function newGame(){
  score = 0; lives = 2; stage = 1; nextExtend = 50000;
  resetPower(); startStage(); state = 'play'; paused = false;
}
function startStage(){
  theme = THEMES[(stage-1) % THEMES.length]; stageSeed = stage * 1.37;
  scrollX = 0; shots = []; enemies = []; ebullets = []; particles = []; capsules = []; pending = [];
  events = buildEvents(); evIdx = 0; boss = null; bossSpawned = false; stageClear = 0; warnT = 0; capCount = 0;
  player = { x:100, y:PH/2, alive:true, respawn:0, inv:120, fireCd:0 };
  hist = []; for (let i=0;i<60;i++) hist.push({x:player.x, y:player.y});
  msg = { text:'STAGE ' + stage, sub:theme.name, t:170 };
  startBgm('stage');
}
function gameOver(){
  state = 'over'; gameOverT = 0; stopBgm();
  try { localStorage.setItem('stellarViperHi', hi); } catch(e){}
}

// ---------------- 地形 ----------------
function env(wx){
  let e = 0;
  for (const [a,b] of theme.sec) if (wx > a && wx < b) e = Math.max(e, Math.min(1, (wx-a)/300, (b-wx)/300));
  return e;
}
function terr(wx){
  const e = env(wx); if (e <= 0) return [0, PH];
  const s = stageSeed;
  let t = e*(58 + 34*Math.sin(wx*0.0105+s) + 22*Math.sin(wx*0.027+s*1.7) + 8*Math.sin(wx*0.09+s*3));
  let b = PH - e*(62 + 34*Math.sin(wx*0.0087+s*2.3) + 24*Math.sin(wx*0.031+s*0.6) + 8*Math.sin(wx*0.083+s));
  t = Math.max(0, t); b = Math.min(PH, b);
  if (b - t < 200){ const m = (t+b)/2; t = m-100; b = m+100; }
  return [t, b];
}

// ---------------- 出現スケジュール ----------------
function buildEvents(){
  const r = rng(stage*977 + 13), ev = [], dens = 1 + rank()*0.15;
  for (let d = 250; d < STAGE_LEN - 150; ){
    const ground = env(d + W + 20) > 0.85, roll = r();
    if (ground){
      if (roll < 0.33) ev.push({d, type:'turret', side: r() < 0.5 ? 'top' : 'bot'});
      else if (roll < 0.48) ev.push({d, type:'hatch', side: r() < 0.5 ? 'top' : 'bot'});
      else if (roll < 0.8) ev.push({d, type:'fan', y: 150 + r()*140});
      else ev.push({d, type:'rusher', n:3});
      d += (70 + r()*60) / dens;
    } else {
      if (roll < 0.4) ev.push({d, type:'fan', y: 60 + r()*320});
      else if (roll < 0.6) ev.push({d, type:'garun', n:4});
      else if (roll < 0.85) ev.push({d, type:'rusher', n:4});
      else ev.push({d, type:'redone'});
      d += (110 + r()*70) / dens;
    }
  }
  return ev;
}
const ENEMY_DEF = {
  fan:{hp:1, r:10, score:100}, garun:{hp:1, r:13, score:200}, rusher:{hp:2, r:12, score:300},
  turret:{hp:2, r:12, score:400}, hatch:{hp:12, r:20, score:1500}, mini:{hp:1, r:8, score:100},
};
function mk(type, x, y, o = {}){
  const e = { type, x, y, t:0, flash:0, ...ENEMY_DEF[type], ...o };
  enemies.push(e); return e;
}
function spawnEvent(ev){
  const [tp, bt] = terr(scrollX + W + 20);
  const lo = tp + 50, hiY = bt - 50, cy = v => clamp(v, lo, hiY);
  switch (ev.type){
    case 'fan': {
      const g = {left:5, clean:true}, y0 = cy(ev.y);
      for (let i=0;i<5;i++) pending.push({d:i*9, f:() => mk('fan', W+20, y0, {group:g, y0, ph:0, a:Math.PI})});
      break;
    }
    case 'garun':
      for (let i=0;i<ev.n;i++) pending.push({d:i*28, f:() => {
        const y0 = rnd(130, PH-130); mk('garun', W+20, y0, {y0, red: i === ev.n-1});
      }});
      break;
    case 'rusher': {
      const g = {left:ev.n, clean:true};
      for (let i=0;i<ev.n;i++) pending.push({d:i*22, f:() => mk('rusher', W+20, cy(rnd(lo, hiY)), {group:g})});
      break;
    }
    case 'redone': { const y0 = rnd(130, PH-130); mk('garun', W+20, y0, {y0, red:true}); break; }
    case 'turret': mk('turret', W+20, ev.side === 'top' ? tp : bt, {side:ev.side, cd:(rnd(20,90))|0}); break;
    case 'hatch':  mk('hatch', W+30, ev.side === 'top' ? tp : bt, {side:ev.side, spawned:0}); break;
  }
}

// ---------------- パワーアップ ----------------
function canSelect(i){
  return [pw.speed < 5, !pw.missile, !pw.double, !pw.laser, pw.options < 4, pw.shield <= 0][i];
}
function selectPower(){
  if (cursor < 0 || !canSelect(cursor)) return;
  switch (cursor){
    case 0: pw.speed++; break;
    case 1: pw.missile = true; break;
    case 2: pw.double = true; pw.laser = false; break;
    case 3: pw.laser = true; pw.double = false; break;
    case 4: pw.options++; break;
    case 5: pw.shield = loadout.barrier === 0 ? 6 : 15; break;
  }
  cursor = -1; sfx('power');
}
function dropCapsule(x, y){
  capCount++;
  capsules.push({ x, y, blue: capCount % 7 === 0, t:0 });
}

// ---------------- エフェクト ----------------
const EXP_COLS = ['#fff','#ffe066','#ff9a2a','#ff4a1a'];
function explode(x, y, size = 12){
  const n = size * 1.6;
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, sp = rnd(0.5, size*0.22);
    particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:rnd(18,40), max:40,
      c: EXP_COLS[(Math.random()*4)|0], s: rnd(1.5, 3.5) });
  }
  particles.push({ ring:true, x, y, r:2, max:size*2.4, life:18 });
}
function spark(x, y, c = '#aef'){
  for (let i=0;i<4;i++) particles.push({ x, y, vx:rnd(-2,1), vy:rnd(-2,2), life:rnd(6,12), max:12, c, s:1.5 });
}

// ---------------- 更新 ----------------
function shooters(){
  const a = [{x:player.x, y:player.y, s:0}];
  for (let i=0;i<pw.options;i++){ const h = hist[Math.min((i+1)*10, hist.length-1)]; a.push({x:h.x, y:h.y, s:i+1}); }
  return a;
}
const countShots = (s, type) => shots.reduce((n, x) => n + (!x.dead && x.s === s && x.type === type ? 1 : 0), 0);
function fireAll(){
  let fired = false;
  const L = loadout;
  for (const sh of shooters()){
    const base = { s:sh.s, dmg:1 };
    if (pw.laser){
      if (L.laser === 0){ shots.push({ ...base, type:'laser', x:sh.x+16, y:sh.y, len:8, max:90, hitSet:new Set() }); fired = true; }
      else if (L.laser === 1){
        if (countShots(sh.s, 'ripple') < 4){ shots.push({ ...base, type:'ripple', x:sh.x+16, y:sh.y, rad:5, hitSet:new Set() }); fired = true; }
      } else {
        for (const oy of [-5, 5]) shots.push({ ...base, type:'laser', x:sh.x+16, y:sh.y+oy, len:8, max:40, hitSet:new Set() });
        fired = true;
      }
    } else if (countShots(sh.s, 'shot') < 3){
      shots.push({ ...base, type:'shot', x:sh.x+14, y:sh.y, vx:13, vy:0 });
      if (pw.double){
        if (L.double === 0) shots.push({ ...base, type:'dbl', x:sh.x+8, y:sh.y-4, vx:9, vy:-9 });
        else if (L.double === 1) shots.push({ ...base, type:'dbl', x:sh.x-12, y:sh.y, vx:-13, vy:0 });
        else for (const vy of [-3.5, 3.5]) shots.push({ ...base, type:'dbl', x:sh.x+10, y:sh.y, vx:12.5, vy });
      }
      fired = true;
    }
    if (pw.missile){
      if (L.missile === 0 && countShots(sh.s, 'missile') < 1)
        shots.push({ ...base, dmg:2, type:'missile', x:sh.x, y:sh.y+6, vx:2.5, vy:3, dir:1, ground:false });
      else if (L.missile === 1 && countShots(sh.s, 'missile') < 1)
        for (const dir of [1, -1]) shots.push({ ...base, dmg:2, type:'missile', x:sh.x, y:sh.y+6*dir, vx:2.5, vy:3*dir, dir, ground:false });
      else if (L.missile === 2 && countShots(sh.s, 'bomb') < 1)
        shots.push({ ...base, dmg:2, type:'bomb', x:sh.x+4, y:sh.y+6, vx:3.2, vy:0.5, t:0 });
      else if (L.missile === 3 && countShots(sh.s, 'photon') < 1)
        shots.push({ ...base, dmg:2, type:'photon', x:sh.x, y:sh.y+8, vx:1, vy:7, hitSet:new Set() });
    }
  }
  if (fired) sfx(pw.laser ? 'laser' : 'shot');
}
function bombBlast(x, y, skipBoss = false){
  explode(x, y, 22); sfx('boom');
  particles.push({ ring:true, x, y, r:4, max:48, life:18 });
  for (const e of enemies) if (!e.dead && d2(e.x, e.y, x, y) < (48 + e.r)**2) damage(e, 2);
  if (!skipBoss && boss && !boss.dying && !boss.leaving) bossHit(x, y, 2);
}
function playerDie(){
  if (!player.alive || player.inv > 0) return;
  player.alive = false; player.respawn = 150;
  explode(player.x, player.y, 30); explode(player.x+10, player.y-6, 16);
  sfx('die'); resetPower(); shakeT = 20;
}
// SHIELD は前方からの攻撃のみ防ぐ
const shieldCovers = fromX => pw.shield > 0 && (loadout.barrier === 0 || fromX > player.x + 2);
function hurtPlayer(fromX){
  if (!player.alive || player.inv > 0) return false;
  if (shieldCovers(fromX)){ pw.shield--; sfx('shield'); return true; }
  playerDie(); return true;
}
function updatePlayer(){
  const p = player;
  if (!p.alive){
    if (--p.respawn <= 0){
      if (lives <= 0){ gameOver(); return; }
      lives--; p.alive = true; p.x = 100; p.y = PH/2; p.inv = 150; ebullets = [];
      for (const h of hist){ h.x = p.x; h.y = p.y; }
    }
    return;
  }
  const sp = 2.4 + pw.speed*0.9;
  let dx = (K.right()?1:0) - (K.left()?1:0), dy = (K.down()?1:0) - (K.up()?1:0);
  if (dx && dy){ dx *= 0.7071; dy *= 0.7071; }
  p.x = clamp(p.x + dx*sp, 16, W-24); p.y = clamp(p.y + dy*sp, 10, PH-10);
  if (dx || dy){ hist.unshift({x:p.x, y:p.y}); if (hist.length > 60) hist.pop(); }
  if (p.inv > 0) p.inv--;
  if (hit('KeyX','KeyK','ShiftLeft','ShiftRight')) selectPower();
  p.fireCd--;
  if (K.fire() && p.fireCd <= 0){ fireAll(); p.fireCd = pw.laser ? 7 : 5; }
  // 地形との衝突
  for (const [ox, oy] of [[16,0],[-12,-6],[-12,6]]){
    const [t, b] = terr(scrollX + p.x + ox), py = p.y + oy;
    if (py < t || py > b){
      if (p.inv > 0) p.y = clamp(p.y, t + 8, b - 8);
      else { playerDie(); return; }
    }
  }
}
function damage(e, d){
  e.hp -= d; e.flash = 4;
  if (e.hp <= 0) killEnemy(e, true); else sfx('hit');
}
function killEnemy(e, byPlayer, drops = true){
  if (e.dead) return;
  e.dead = true;
  if (byPlayer){
    score += e.score;
    explode(e.x, e.y, e.type === 'hatch' ? 28 : 14); sfx('boom');
    if (drops && e.red) dropCapsule(e.x, e.y);
  } else if (e.group) e.group.clean = false;
  if (e.group){
    e.group.left--;
    if (e.group.left === 0 && e.group.clean && byPlayer && drops) dropCapsule(e.x, e.y);
  }
}
function fireAt(x, y, spd = 2.8 + rank()*0.5){
  if (!player.alive || d2(x, y, player.x, player.y) < 90*90) return;
  const a = Math.atan2(player.y - y, player.x - x);
  ebullets.push({ x, y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:4 });
}
function updateShots(){
  for (const s of shots){
    if (s.type === 'laser'){ s.x += 16; s.len = Math.min(s.len + 16, s.max); }
    else if (s.type === 'ripple'){ s.x += 9; s.rad = Math.min(s.rad + 1.6, 34); }
    else if (s.type === 'bomb'){ s.t++; s.vy += 0.12; s.x += s.vx; s.y += s.vy; }
    else if (s.type === 'missile'){
      // dir=1: 地面を這う / dir=-1: 天井を這う
      const surf = () => { const [t, b] = terr(scrollX + s.x); return s.dir > 0 ? (b < PH ? b - 4 : null) : (t > 0 ? t + 4 : null); };
      if (!s.ground){
        s.x += s.vx; s.y += s.vy;
        const y = surf();
        if (y !== null && (s.dir > 0 ? s.y >= y : s.y <= y)){ s.ground = true; s.y = y; }
      } else {
        s.x += 4;
        const y = surf();
        if (y === null) s.ground = false; else s.y = y;
      }
      if (s.y > PH + 10) s.dead = true;
    } else { s.x += s.vx; s.y += s.vy; }
    if (s.x - (s.len || 0) > W + 10 || s.x < -10 || s.y < -10 || s.y > PH + 10) s.dead = true;
    if (s.type !== 'missile' && s.type !== 'ripple' && !s.dead){
      const [t, b] = terr(scrollX + s.x);
      if (s.y < t || s.y > b){
        s.dead = true;
        if (s.type === 'bomb') bombBlast(s.x, s.y); else spark(s.x, s.y);
      }
    }
    if (s.type === 'bomb' && !s.dead && s.t > 55){ s.dead = true; bombBlast(s.x, s.y); }
    if (s.dead) continue;
    // 敵との当たり判定
    for (const e of enemies){
      if (e.dead) continue;
      if (s.hitSet && s.hitSet.has(e)) continue;
      let h;
      if (s.type === 'laser') h = e.x + e.r > s.x - s.len && e.x - e.r < s.x && Math.abs(e.y - s.y) < e.r + 3;
      else if (s.type === 'ripple') h = Math.abs(e.x - s.x) < e.r + s.rad*0.35 && Math.abs(e.y - s.y) < e.r + s.rad;
      else h = d2(e.x, e.y, s.x, s.y) < (e.r + 4)**2;
      if (h){
        if (s.type === 'bomb'){ s.dead = true; bombBlast(s.x, s.y); break; }
        damage(e, s.dmg);
        if (s.hitSet) s.hitSet.add(e); else { s.dead = true; break; }
      }
    }
    if (!s.dead && boss && !boss.dying && !boss.leaving && bossHit(s.x, s.y, s.dmg)){
      s.dead = true;
      if (s.type === 'bomb') bombBlast(s.x, s.y, true);
    }
  }
  shots = shots.filter(s => !s.dead);
}
function updateEnemies(){
  const r = rank();
  for (const e of enemies){
    if (e.dead) continue;
    e.t++; if (e.flash > 0) e.flash--;
    switch (e.type){
      case 'fan':
        if (e.ph === 0){
          e.x -= 4 + r*0.3;
          e.y = e.y0 + Math.sin(e.t*0.09)*14;
          if (e.x < 260 + (e.y0 % 60)){ e.ph = 1; e.dir = player.y < e.y ? 1 : -1; }
        } else {
          if (e.ph === 1){ e.a += e.dir*0.085; if (Math.abs(e.a - Math.PI) >= Math.PI){ e.a = 0; e.ph = 2; } }
          e.x += Math.cos(e.a)*4.5; e.y += Math.sin(e.a)*4.5;
          if (r > 0 && e.ph === 2 && Math.random() < 0.012*r) fireAt(e.x, e.y);
        }
        break;
      case 'garun':
        e.x -= 2.3; e.y = e.y0 + Math.sin(e.t*0.045)*80;
        if (Math.random() < 0.004*(1+r)) fireAt(e.x, e.y);
        break;
      case 'rusher':
        e.x -= 1.8 + r*0.2;
        if (player.alive) e.y += clamp(player.y - e.y, -1.3, 1.3);
        if (e.t % 100 === 50) fireAt(e.x, e.y);
        break;
      case 'turret': {
        e.x -= SCROLL;
        const [t, b] = terr(scrollX + e.x); e.y = e.side === 'top' ? t : b;
        if (--e.cd <= 0){
          e.cd = Math.max(55, 130 - r*15);
          if (e.x < W-20 && e.x > 60) fireAt(e.x, e.y + (e.side === 'top' ? 8 : -8));
        }
        break;
      }
      case 'hatch': {
        e.x -= SCROLL;
        const [t, b] = terr(scrollX + e.x); e.y = e.side === 'top' ? t + 8 : b - 8;
        e.open = e.t % 80 < 40 && e.x < W - 40;
        if (e.t % 40 === 20 && e.spawned < 5 + r && e.x < W - 40 && e.x > 100){
          mk('mini', e.x, e.y + (e.side === 'top' ? 12 : -12), {dir: e.side === 'top' ? 1 : -1});
          e.spawned++;
        }
        break;
      }
      case 'mini':
        if (e.t < 25){ e.y += e.dir*2.5; e.x -= SCROLL; }
        else { e.x -= 2.6 + r*0.2; if (player.alive) e.y += clamp(player.y - e.y, -1.4, 1.4); }
        break;
    }
    if (e.x < -50 || e.x > W + 60 || e.y < -60 || e.y > PH + 60){ killEnemy(e, false); continue; }
    // 自機との接触
    if (player.alive && player.inv <= 0 && d2(e.x, e.y, player.x, player.y) < (e.r + 5)**2){
      if (shieldCovers(e.x)){ pw.shield--; sfx('shield'); damage(e, 5); }
      else playerDie();
    }
  }
  enemies = enemies.filter(e => !e.dead);
}
function spawnBoss(){
  const bh = 6 + rank()*2;
  boss = { x:W+140, y:PH/2, t:0, bar:[bh,bh,bh,bh], core:6 + rank()*2, flash:0, dying:0, leaving:false };
}
function bossHit(sx, sy, dmg){
  const b = boss, dx = sx - b.x, dy = sy - b.y;
  if (dx < -64 || dx > 92 || Math.abs(dy) > 64) return false;
  if (Math.abs(dy) < 13){
    for (let i=3;i>=0;i--){
      if (b.bar[i] > 0){
        if (dx >= BX[i] - 3){
          b.bar[i] -= dmg; b.flash = 3;
          if (b.bar[i] <= 0){ explode(b.x + BX[i], b.y, 14); sfx('boom'); score += 1000; } else sfx('hit');
          return true;
        }
        return false;
      }
    }
    if (dx >= -14){
      b.core -= dmg; b.flash = 4; sfx('hit');
      if (b.core <= 0){ b.dying = 150; ebullets = []; score += 10000*stage; sfx('bigBoom'); stopBgm(); }
      return true;
    }
    return false;
  }
  sfx('tink'); spark(sx, sy, '#fff');
  return true;
}
function updateBoss(){
  if (!boss) return;
  const b = boss; b.t++; if (b.flash > 0) b.flash--;
  if (b.dying > 0){
    b.dying--; shakeT = 4;
    if (b.dying % 6 === 0){ explode(b.x + rnd(-60, 90), b.y + rnd(-60, 60), 20); sfx('boom'); }
    if (b.dying === 0){
      for (let i=0;i<6;i++) explode(b.x + rnd(-40,80), b.y + rnd(-40,40), 36);
      flashT = 15; boss = null; stageClear = 300;
      msg = { text:'STAGE CLEAR', sub:'BONUS ' + (10000*stage), t:260 };
    }
    return;
  }
  if (b.leaving){ b.x += 3; if (b.x > W + 200){ boss = null; stageClear = 200; msg = {text:'STAGE CLEAR', sub:'', t:180}; stopBgm(); } return; }
  if (b.x > W - 160) b.x -= 1.5;
  else {
    const ty = clamp(player.alive ? player.y : PH/2, 90, PH-90), sp = 1.1 + rank()*0.25;
    b.y += clamp(ty - b.y, -sp, sp);
  }
  const period = Math.max(50, 95 - rank()*10);
  if (b.x < W - 100 && b.t % period === 0){
    for (const dy of [-44,-24,24,44]) ebullets.push({ x:b.x-66, y:b.y+dy, vx:-7 - rank(), vy:0, r:4, beam:true });
    sfx('beam');
  }
  if (b.x < W - 100 && b.t % 130 === 65){ fireAt(b.x-60, b.y-40); fireAt(b.x-60, b.y+40); }
  if (b.t > 60*50) b.leaving = true;
  // 接触判定
  if (player.alive && player.inv <= 0){
    const dx = player.x + 14 - b.x, dy = player.y - b.y;
    if (dx > -62 && player.x - 14 - b.x < 92 && Math.abs(dy) < 66){
      let front = -14;
      for (let i=3;i>=0;i--) if (b.bar[i] > 0){ front = BX[i] - 3; break; }
      if (!(Math.abs(dy) < 10 && dx < front)) playerDie();
    }
  }
}
function updateEBullets(){
  for (const b of ebullets){
    b.x += b.vx; b.y += b.vy;
    if (b.x < -30 || b.x > W + 30 || b.y < -30 || b.y > PH + 30){ b.dead = true; continue; }
    if (!player.alive) continue;
    const hr = b.beam ? 14 : 0;
    if (Math.abs(b.x - player.x) < b.r + 4 + hr && Math.abs(b.y - player.y) < b.r + 3){
      if (hurtPlayer(b.x)) b.dead = true;
    }
  }

}
function updateCapsules(){
  for (const c of capsules){
    c.t++; c.x -= SCROLL*0.8;

    if (player.alive && d2(c.x, c.y, player.x, player.y) < 22*22){
      c.dead = true;
      if (c.blue){
        for (const e of enemies) if (e.x < W) killEnemy(e, true, false);
        ebullets = []; flashT = 12; sfx('blue');
      } else { cursor = (cursor + 1) % 6; sfx('capsule'); }

    }
  }

}
function updateParticles(){
  for (const p of particles){
    p.life--;
    if (p.ring) p.r += (p.max - p.r)*0.25;
    else { p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; }
  }

}
function updateStars(sp = SCROLL){
  for (const s of stars){ s.x -= s.z*sp*1.4; if (s.x < 0){ s.x += W; s.y = Math.random()*PH; } }
}

function update(){
  frame++;
  if (hit('KeyM')){ muted = !muted; if (master) master.gain.value = muted ? 0 : 0.5; }
  if (state === 'title'){ updateStars(2); if (hit('Enter','KeyZ','Space')){ state = 'select'; selRow = 0; sfx('capsule'); } return; }
  if (state === 'select'){
    updateStars(2);
    if (hit('ArrowUp','KeyW')){ selRow = (selRow + 4) % 5; sfx('tink'); }
    if (hit('ArrowDown','KeyS')){ selRow = (selRow + 1) % 5; sfx('tink'); }
    if (selRow < 4){
      const k = EDIT_ROWS[selRow], n = WEAPONS[k].length;
      if (hit('ArrowLeft','KeyA')){ loadout[k] = (loadout[k] + n - 1) % n; sfx('capsule'); }
      if (hit('ArrowRight','KeyD')){ loadout[k] = (loadout[k] + 1) % n; sfx('capsule'); }
    }
    if (hit('Enter') || (selRow === 4 && hit('KeyZ','Space'))){
      try { localStorage.setItem('stellarViperLoadout', JSON.stringify(loadout)); } catch(e){}
      sfx('power'); newGame();
    } else if (hit('KeyZ','Space')){ selRow++; sfx('tink'); }
    if (hit('Escape','KeyX')) state = 'title';
    return;
  }
  if (state === 'over'){
    updateStars(); updateParticles(); gameOverT++;
    if (gameOverT > 90 && hit('Enter','KeyZ','Space')) state = 'title';
    return;
  }
  if (hit('KeyP','Escape')) paused = !paused;
  if (paused) return;

  scrollX += SCROLL;
  updateStars();
  while (evIdx < events.length && events[evIdx].d <= scrollX){ spawnEvent(events[evIdx]); evIdx++; }
  if (!bossSpawned && scrollX >= STAGE_LEN){ bossSpawned = true; warnT = 200; stopBgm(); sfx('warn'); }
  if (warnT > 0 && --warnT === 0){ spawnBoss(); startBgm('boss'); }
  for (const p of pending) if (--p.d < 0){ p.f(); p.done = true; }
  pending = pending.filter(p => !p.done);

  updatePlayer();
  if (state !== 'play') return;
  updateShots(); updateEnemies(); updateBoss(); updateEBullets(); updateCapsules(); updateParticles();

  if (msg && --msg.t <= 0) msg = null;
  if (stageClear > 0 && --stageClear === 0){ stage++; startStage(); }
  if (flashT > 0) flashT--;
  if (shakeT > 0) shakeT--;
  if (score >= nextExtend){ lives++; nextExtend += 70000; sfx('oneup'); }
  if (score > hi) hi = score;
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, PH);
  g.addColorStop(0, theme.bg2); g.addColorStop(1, theme.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, PH);
  // 遠景の惑星
  const px = W + 160 - ((scrollX*0.05 + 250) % (W + 320)), py = 110;
  const pg = ctx.createRadialGradient(px - 25, py - 25, 5, px, py, 70);
  pg.addColorStop(0, theme.planet[0]); pg.addColorStop(1, theme.planet[1]);
  ctx.globalAlpha = 0.55; ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(px, py, 70, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = theme.planet[0]; ctx.lineWidth = 2; ctx.globalAlpha = 0.25;
  ctx.beginPath(); ctx.ellipse(px, py, 115, 20, -0.25, 0, Math.PI*2); ctx.stroke();
  ctx.globalAlpha = 1;
  for (const s of stars){
    ctx.fillStyle = s.z > 1.5 ? '#fff' : s.z > 0.5 ? '#9ab' : '#456';
    ctx.fillRect(s.x, s.y, s.z > 1.5 ? 2 + s.z : 1.5, s.z > 1.5 ? 2 : 1.5);
  }

function drawTerrain(){
  const wx0 = Math.floor(scrollX/8)*8, T = [], B = [];
  let any = false;
  for (let i=0;i<=W/8+2;i++){
    const wx = wx0 + i*8, [t, b] = terr(wx), sx = wx - scrollX;
    T.push([sx, t, wx]); B.push([sx, b, wx]);
    if (t > 0.5 || b < PH - 0.5) any = true;
  }
  if (!any) return;
  const last = T[T.length-1][0];
  for (const top of [true, false]){
    const A = top ? T : B, base = top ? -2 : PH + 2;
    const g = ctx.createLinearGradient(0, top ? 0 : PH, 0, top ? 130 : PH - 130);
    g.addColorStop(0, theme.rock2); g.addColorStop(1, theme.rock1);
    ctx.beginPath(); ctx.moveTo(A[0][0], base);
    for (const [x, y] of A) ctx.lineTo(x, y);
    ctx.lineTo(last, base); ctx.closePath();
    ctx.fillStyle = g; ctx.fill();
    // 岩肌の模様
    ctx.save(); ctx.clip();
    ctx.strokeStyle = theme.edge; ctx.lineWidth = 1.5;
    for (const [off, al] of [[10, 0.3], [24, 0.14]]){
      ctx.globalAlpha = al; ctx.beginPath();
      A.forEach(([x, y], i) => { const yy = top ? y - off : y + off; i ? ctx.lineTo(x, yy) : ctx.moveTo(x, yy); });
      ctx.stroke();
    }
    ctx.globalAlpha = 0.35; ctx.fillStyle = theme.rock2;
    for (const [x, y, wx] of A){
      const h = Math.sin(wx*12.9898 + (top ? 1 : 7))*43758.5453 % 1;
      if (Math.abs(h) < 0.3){ const d = 34 + Math.abs(h)*120; ctx.fillRect(x, top ? y - d : y + d - 6, 6, 6); }
    }
    ctx.restore();
    ctx.globalAlpha = 1; ctx.strokeStyle = theme.edge; ctx.lineWidth = 2;
    ctx.beginPath(); A.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
  }
}

      ctx.fillStyle = fl ? '#fff' : '#a05030';
      ctx.beginPath(); ctx.arc(0, 0, 11, top ? 0 : Math.PI, top ? Math.PI : Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ffd060'; ctx.fillRect(-2, top ? 3 : -5, 4, 2);
      break;
    }
    case 'hatch': {
      const top = e.side === 'top', s = top ? -1 : 1;
      ctx.fillStyle = fl ? '#fff' : '#606a80'; ctx.fillRect(-22, top ? -12 : -4, 44, 16);
      ctx.fillStyle = '#9aa4c0'; ctx.fillRect(-22, top ? -12 : -4, 44, 3);
      if (e.open){
        ctx.fillStyle = '#100'; ctx.fillRect(-12, top ? 2 : -6, 24, 4);
        ctx.fillStyle = '#c04040';
        ctx.fillRect(-16, top ? 4 : -14, 4, 10); ctx.fillRect(12, top ? 4 : -14, 4, 10);
      } else { ctx.fillStyle = '#c04040'; ctx.fillRect(-14, top ? 2 : -6, 28, 4); }
      ctx.fillStyle = e.t % 30 < 15 ? '#ff0' : '#840'; ctx.fillRect(-2, s < 0 ? -8 : 6, 4, 3);
      break;
    }
    case 'mini': {
      ctx.rotate(e.t*0.2);
      ctx.fillStyle = fl ? '#fff' : '#ffa030';
      ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-6, -6); ctx.lineTo(-3, 0); ctx.lineTo(-6, 6); ctx.closePath(); ctx.fill();
      break;
    }
  }
  ctx.restore();
}
function drawBoss(b){
  ctx.save(); ctx.translate(b.x, b.y);
  const g = ctx.createLinearGradient(0, -62, 0, 62);
  g.addColorStop(0, '#9ab0e0'); g.addColorStop(0.5, '#3a4a78'); g.addColorStop(1, '#9ab0e0');
  ctx.fillStyle = g; ctx.strokeStyle = '#c8d4ff'; ctx.lineWidth = 2;
  for (const s of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(-60, 14*s); ctx.lineTo(-60, 40*s); ctx.lineTo(-40, 62*s); ctx.lineTo(70, 62*s);
    ctx.lineTo(92, 40*s); ctx.lineTo(92, 14*s); ctx.closePath(); ctx.fill(); ctx.stroke();
    // 装甲の筋
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    for (let x=-30;x<80;x+=22){ ctx.beginPath(); ctx.moveTo(x, 18*s); ctx.lineTo(x, 58*s); ctx.stroke(); }
    ctx.strokeStyle = '#c8d4ff';
    // 砲台
    ctx.fillStyle = '#20283c'; ctx.fillRect(-68, 24*s - 3, 8, 6); ctx.fillRect(-68, 44*s - 3, 8, 6);
    ctx.fillStyle = g;
  }
  // 中央ブロック
  ctx.fillStyle = '#2a3452'; ctx.fillRect(-12, -14, 104, 28);
  ctx.fillStyle = '#0a0e1a'; ctx.fillRect(-60, -13, 48, 26);
  // エンジン
  ctx.fillStyle = frame % 4 < 2 ? '#ffa020' : '#fff060';
  for (const dy of [-40, 0, 40]) ctx.fillRect(92, dy - 5, 8 + Math.random()*10, 10);
  // コア
  const pulse = 9 + Math.sin(frame*0.2)*2, danger = b.bar.every(v => v <= 0);
  const cg = ctx.createRadialGradient(-4, 0, 1, -4, 0, pulse + 4);
  cg.addColorStop(0, '#fff');
  cg.addColorStop(0.4, danger && frame % 10 < 5 ? '#ff6060' : '#60c0ff');
  cg.addColorStop(1, 'rgba(40,80,255,0)');
  ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(-4, 0, pulse + 4, 0, Math.PI*2); ctx.fill();
  // バリア
  for (let i=0;i<4;i++){
    if (b.bar[i] <= 0) continue;
    ctx.fillStyle = b.flash > 0 ? '#fff' : '#80d0ff';
    ctx.fillRect(BX[i] - 3, -12, 6, 24);
    ctx.fillStyle = '#2060c0'; ctx.fillRect(BX[i] - 1, -12, 2, 24);
  }
  if (b.flash > 0){ ctx.globalAlpha = 0.25; ctx.fillStyle = '#fff'; ctx.fillRect(-60, -62, 152, 124); ctx.globalAlpha = 1; }
  ctx.restore();
}
function drawShots(){
  for (const s of shots){
    if (s.type === 'laser'){
      ctx.fillStyle = '#40e0ff'; ctx.fillRect(s.x - s.len, s.y - 2.5, s.len, 5);
      ctx.fillStyle = '#fff'; ctx.fillRect(s.x - s.len, s.y - 1, s.len, 2);
    } else if (s.type === 'ripple'){
      ctx.lineWidth = 3; ctx.strokeStyle = frame % 4 < 2 ? '#ff9040' : '#ffe080';
      ctx.beginPath(); ctx.ellipse(s.x, s.y, s.rad*0.35, s.rad, 0, 0, Math.PI*2); ctx.stroke();
    } else if (s.type === 'bomb'){
      ctx.fillStyle = '#ff7020'; ctx.beginPath(); ctx.arc(s.x, s.y, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 1, s.y - 3, 2, 2);
    } else if (s.type === 'photon'){
      ctx.fillStyle = '#c070ff'; ctx.beginPath(); ctx.ellipse(s.x, s.y, 4, 9, 0, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(s.x, s.y + 2, 2, 4, 0, 0, Math.PI*2); ctx.fill();
    } else if (s.type === 'missile'){
      ctx.save(); ctx.translate(s.x, s.y); if (!s.ground) ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#ffa020'; ctx.fillRect(-10, -1, 4, 2);
      ctx.fillStyle = '#d0d8e8'; ctx.fillRect(-6, -2, 10, 4); ctx.restore();
    } else if (s.type === 'dbl'){
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(Math.atan2(s.vy, s.vx));
      ctx.fillStyle = '#ffe080'; ctx.fillRect(-6, -1.5, 12, 3); ctx.restore();
    } else {
      ctx.fillStyle = '#ffe080'; ctx.fillRect(s.x - 8, s.y - 2, 14, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(s.x - 4, s.y - 1, 10, 2);
    }
  }
}
function drawEBullets(){
  for (const b of ebullets){
    if (b.beam){
      ctx.fillStyle = '#40a0ff'; ctx.fillRect(b.x - 16, b.y - 3, 32, 6);
      ctx.fillStyle = '#fff'; ctx.fillRect(b.x - 16, b.y - 1, 32, 2);
    } else {
      ctx.fillStyle = frame % 6 < 3 ? '#ff6040' : '#ffd060';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(b.x, b.y, 1.6, 0, Math.PI*2); ctx.fill();
    }
  }
}
function drawCapsules(){
  for (const c of capsules){
    const y = c.y + Math.sin(c.t*0.1)*3;
    const g = ctx.createLinearGradient(0, y - 7, 0, y + 7);
    if (c.blue){ g.addColorStop(0, '#a0d0ff'); g.addColorStop(1, '#1040c0'); }
    else { g.addColorStop(0, '#ffb080'); g.addColorStop(1, '#c02000'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(c.x, y, 10, 7, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = c.t % 16 < 8 ? '#fff' : '#ffd060'; ctx.fillRect(c.x - 7, y - 1, 14, 2);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
  }
}
function drawParticles(){
  for (const p of particles){
    if (p.ring){
      ctx.globalAlpha = p.life/18; ctx.strokeStyle = '#ffe0a0'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.stroke();
    } else {
      ctx.globalAlpha = Math.min(1, p.life/p.max*1.5); ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
    }
  }
  ctx.globalAlpha = 1;
}
function text(str, x, y, size, color, align = 'center', font = FONT){
  ctx.font = `${size}px ${font}`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#000'; ctx.fillText(str, x + 2, y + 2);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawHUD(){
  ctx.fillStyle = '#000'; ctx.fillRect(0, PH, W, H - PH);
  ctx.fillStyle = '#2a3a80'; ctx.fillRect(0, PH, W, 2);
  for (let i=0;i<6;i++){
    const x = 8 + i*78, y = PH + 9, on = i === cursor, av = canSelect(i);
    ctx.fillStyle = on ? (frame % 20 < 10 ? '#ff8020' : '#ffc040') : '#0c1638';
    ctx.fillRect(x, y, 74, 24);
    ctx.strokeStyle = on ? '#fff' : '#3a5ad0'; ctx.lineWidth = 2; ctx.strokeRect(x, y, 74, 24);
    ctx.font = `8px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = on ? '#000' : av ? '#a0d0ff' : '#34405a';
    ctx.fillText(gaugeLabels()[i], x + 37, y + 13);
  }
  ctx.textAlign = 'left'; ctx.font = `10px ${FONT}`; ctx.fillStyle = '#fff';
  ctx.fillText('1P ' + String(score).padStart(8, '0'), 490, PH + 14);
  ctx.fillStyle = '#ff6060'; ctx.fillText('HI ' + String(hi).padStart(8, '0'), 490, PH + 30);
  ctx.font = `8px ${FONT}`; ctx.fillStyle = '#a0d0ff';
  ctx.fillText('STAGE ' + stage, 690, PH + 14);
  ctx.fillText('REST ' + Math.max(0, lives), 690, PH + 30);
}
function drawOverlayText(){
  if (msg){
    const a = Math.min(1, msg.t/30);
    ctx.globalAlpha = a;
    text(msg.text, W/2, PH/2 - 20, 28, '#fff');
    if (msg.sub) text(msg.sub, W/2, PH/2 + 22, 12, '#80d0ff');
    ctx.globalAlpha = 1;
  }
  if (warnT > 0 && warnT % 40 < 26){
    ctx.fillStyle = 'rgba(255,0,0,0.18)'; ctx.fillRect(0, PH/2 - 40, W, 80);
    text('WARNING!!', W/2, PH/2 - 8, 32, '#ff4040');
    text('HUGE BATTLESHIP IS APPROACHING', W/2, PH/2 + 26, 10, '#ffb0b0');
  }
  if (paused){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, PH);
    text('PAUSE', W/2, PH/2, 28, '#fff');
  }
}
function drawTitle(){
  theme = THEMES[0];
  drawBackground();
  const g = ctx.createLinearGradient(0, 90, 0, 170);
  g.addColorStop(0, '#fff'); g.addColorStop(0.5, '#60c0ff'); g.addColorStop(1, '#2040c0');
  ctx.font = `44px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#001040'; ctx.fillText('STELLAR', W/2 + 4, 104); ctx.fillText('VIPER', W/2 + 4, 164);
  ctx.fillStyle = g; ctx.fillText('STELLAR', W/2, 100); ctx.fillText('VIPER', W/2, 160);
  drawShip(W/2 + Math.sin(frame*0.03)*180, 215);
  if (frame % 60 < 40) text('PRESS Z / ENTER TO START', W/2, 262, 14, '#ffe080');
  const J = '"Yu Gothic","Meiryo",sans-serif';
  const lines = [
    '移動：矢印キー / WASD　　ショット：Z / SPACE（押しっぱなしで連射）',
    'パワーアップ：X / SHIFT　　ポーズ：P　　サウンドON/OFF：M',
    '赤い敵や編隊を全滅させるとカプセル出現 → ゲージが進む → Xで装備！',
    '青いカプセルは画面内の敵を一掃',
  ];
  lines.forEach((l, i) => text(l, W/2, 312 + i*26, 14, '#c0d0ff', 'center', J));
  text('HI ' + String(hi).padStart(8, '0'), W/2, 430, 12, '#ff6060');
  ctx.fillStyle = '#000'; ctx.fillRect(0, PH + 10, W, H);
  text('© 2026 STELLAR VIPER PROJECT', W/2, 462, 8, '#556');
}
function drawSelect(){
  theme = THEMES[0];
  drawBackground();
  ctx.fillStyle = 'rgba(0,0,20,0.55)'; ctx.fillRect(0, 0, W, H);
  text('WEAPON SELECT', W/2, 40, 22, '#60c0ff');
  const J = '"Yu Gothic","Meiryo",sans-serif';
  const titles = { missile:'MISSILE', double:'DOUBLE', laser:'LASER', barrier:'BARRIER' };
  EDIT_ROWS.forEach((k, r) => {
    const y = 100 + r*72, on = selRow === r, list = WEAPONS[k];
    ctx.fillStyle = on ? 'rgba(255,128,32,0.18)' : 'rgba(20,40,100,0.35)';
    ctx.fillRect(40, y - 26, W - 80, 62);
    ctx.strokeStyle = on ? '#ff9040' : '#2a3a80'; ctx.lineWidth = 2; ctx.strokeRect(40, y - 26, W - 80, 62);
    text(titles[k], 60, y - 8, 10, on ? '#ffc060' : '#8090c0', 'left');
    const cw = (W - 240) / list.length;
    list.forEach((w, i) => {
      const x = 200 + i*cw + cw/2, sel = loadout[k] === i;
      if (sel){
        ctx.fillStyle = on && frame % 30 < 15 ? '#ff8020' : '#c05010';
        ctx.fillRect(x - cw/2 + 4, y - 20, cw - 8, 24);
      }
      ctx.font = `8px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillStyle = sel ? '#fff' : '#6070a0'; ctx.fillText(w.label, x, y - 8);
    });
    text(list[loadout[k]].desc, 200, y + 20, 13, on ? '#fff' : '#90a0c8', 'left', J);
    if (on){ text('◀', 180, y - 8, 10, '#ffc060'); text('▶', W - 56, y - 8, 10, '#ffc060'); }
  });
  const on = selRow === 4;
  ctx.fillStyle = on ? (frame % 20 < 10 ? '#ff8020' : '#ffc040') : '#0c1638';
  ctx.fillRect(W/2 - 90, 392, 180, 32);
  ctx.strokeStyle = on ? '#fff' : '#3a5ad0'; ctx.strokeRect(W/2 - 90, 392, 180, 32);
  text('START', W/2, 408, 14, on ? '#000' : '#a0d0ff');
  text('↑↓：項目選択　←→：武装変更　Z：決定　ENTER：出撃　X：戻る', W/2, 456, 13, '#8090c0', 'center', J);
}
function draw(){
  if (state === 'title'){ drawTitle(); return; }
  if (state === 'select'){ drawSelect(); return; }
  ctx.save();
  if (shakeT > 0) ctx.translate(rnd(-3, 3), rnd(-3, 3));
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, PH); ctx.clip();
  drawBackground();
  drawTerrain();
  drawCapsules();
  for (const e of enemies) drawEnemy(e);
  if (boss) drawBoss(boss);
  drawShots();
  if (state === 'play' && player.alive){
    for (let i=pw.options-1;i>=0;i--){ const h = hist[Math.min((i+1)*10, hist.length-1)]; drawOption(h.x, h.y, i); }
    if (!(player.inv > 0 && frame % 6 < 3)) drawShip(player.x, player.y);
    if (pw.shield > 0 && loadout.barrier === 1){
      // 前方シールド
      for (const dy of [-9, 9]){
        const g = ctx.createRadialGradient(player.x + 26, player.y + dy, 1, player.x + 26, player.y + dy, 10);
        g.addColorStop(0, '#fff'); g.addColorStop(0.5, `rgba(80,200,255,${0.4 + pw.shield*0.04})`); g.addColorStop(1, 'rgba(80,200,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(player.x + 26, player.y + dy, 6 + Math.sin(frame*0.3)*1.5, 10, 0, 0, Math.PI*2); ctx.fill();
      }
    } else if (pw.shield > 0){
      ctx.strokeStyle = `rgba(80,200,255,${0.3 + pw.shield*0.1})`; ctx.lineWidth = 3;
      ctx.setLineDash([8, 6]); ctx.lineDashOffset = -frame;
      ctx.beginPath(); ctx.ellipse(player.x + 2, player.y, 28, 18, 0, 0, Math.PI*2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  drawEBullets();
  drawParticles();
  if (flashT > 0){ ctx.fillStyle = `rgba(255,255,255,${flashT/15})`; ctx.fillRect(0, 0, W, PH); }
  ctx.restore();
  drawHUD();
  ctx.restore();
  if (state === 'over'){
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 0, W, PH);
    text('GAME OVER', W/2, PH/2 - 10, 32, '#ff4040');
    if (gameOverT > 90 && frame % 60 < 40) text('PRESS Z / ENTER', W/2, PH/2 + 36, 12, '#fff');
  } else drawOverlayText();
}

// ---------------- メインループ (60fps固定) ----------------
let last = performance.now(), acc = 0;
const STEP_MS = 1000/60;
function loop(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP_MS){
    update();
    for (const k in pressed) delete pressed[k];
    acc -= STEP_MS;
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
